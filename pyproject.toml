[project]
name = "german-archives-mcp"
dynamic = ["version"]
description = "MCP server for German archives: search the finding aids and digitised objects of the Deutsche Digitale Bibliothek and Archivportal-D, find the online civil and church registers of Baden, Württemberg, Hohenzollern and North Rhine-Westphalia at their state archives, and download their page images. For genealogy and history."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Anderson" }]
keywords = ["mcp", "genealogy", "family-history", "archives", "germany", "deutsche-digitale-bibliothek", "archivportal-d", "baden", "wuerttemberg", "nordrhein-westfalen", "standesbuecher", "kirchenbuchduplikate", "personenstandsregister", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Sociology :: Genealogy",
    "Topic :: Sociology :: History",
]
dependencies = [
    # Capped below 3: server.compact_schemas reaches into the SDK's private
    # tool registry, which a major release is free to change.
    "mcp>=2.0.0,<3",
    # Capped below 1, and httpcore named: client.PublicOnlyTransport wraps the
    # network backend inside httpx's connection pool, which is httpcore's and
    # private to httpx. A release that moves it fails construction, loudly.
    "httpx>=0.27,<1",
    "httpcore>=1.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    # 0.9 is the oldest ruff whose formatter agrees with the committed style.
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/ianderso/german-archives-mcp"
Repository = "https://github.com/ianderso/german-archives-mcp"
Issues = "https://github.com/ianderso/german-archives-mcp/issues"
Changelog = "https://github.com/ianderso/german-archives-mcp/blob/main/CHANGELOG.md"

[project.scripts]
german-archives-mcp = "german_archives_mcp.__main__:main"

[build-system]
# 1.27 is the first hatchling to accept an SPDX string for `license`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/german_archives_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/german_archives_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]
